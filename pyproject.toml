[project]
name="rivalry"
version="0.2.1"
requires-python=">=3.11"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic>=2.9,<3","openai>=1.0,<3","google-genai>=1.0,<2","perplexityai>=0.1,<1","psycopg[binary]>=3.2,<4", "redis>=6,<7"]
[project.scripts]
rivalry-worker="core.jobs.entrypoint:run_worker"
[project.optional-dependencies]
test=["pytest>=8,<9"]

[tool.setuptools.packages.find]
include=["api*", "apps*", "core*", "engines*", "adapters*", "db*"]

[tool.pytest.ini_options]
testpaths=["tests"]
markers=["integration: requires external services (e.g. PostgreSQL via RIVALRY_TEST_DATABASE_URL)"]
