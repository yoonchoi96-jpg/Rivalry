name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository smoke test
        run: |
          test -f README.md
          test -d core
          test -d engines
          test -d adapters
          test -d apps/rivalry
